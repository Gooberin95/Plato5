name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # ubuntu-latest is 26.04, which has no Python 3.14.4 build in actions/setup-python.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point Pages at GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pages" \
            -f build_type=workflow
          gh api "/repos/${{ github.repository }}/pages" --jq '{build_type,source,status}'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export the static frontend
        env:
          REFLEX_FRONTEND_PATH: /Plato5
        run: |
          reflex export --frontend-only --no-zip
          site=.web/build/client/Plato5
          cp .nojekyll "$site/.nojekyll"
          if [ ! -f "$site/404.html" ]; then
            cp "$site/index.html" "$site/404.html"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .web/build/client/Plato5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
